services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    restart: unless-stopped
    ports: ["5000:5000"]
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/policy_platform
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
